name: 'Docker Push'
description: 'Build and push a docker image'
inputs:
  github_token:
    description: 'GitHub Token'
    required: true
  username:
    description: 'Username or github.actor'
    required: false
  password:
    description: 'Password or github.token'
    required: false
  dockerhub_username:
    description: 'DockerHub Username'
    required: true
  dockerhub_password:
    description: 'DockerHub Password'
    required: true
  image:
    description: 'Image Name'
    required: true
  context:
    description: 'Build Context'
    required: false
  build_args:
    description: 'Build Args'
    required: false
  secrets:
    description: 'Secrets (MY_SECRET=MY_ENV_VAR)'
  dockerfile:
    description: 'Dockerfile'
    required: false
  tag_latest:
    description: 'Tag Latest'
    required: false
    default: auto
  tag_sha:
    description: 'Tag SHA'
    required: false
    default: ''
  version:
    description: 'Version'
    required: false
  allow_vulnerabilities:
    description: 'Allow Vulnerabilities'
    required: false
    default: 'false'
  slack_webhook_url:
    description: 'Slack Webhook URL'
    required: false

  sbom_build_dir:
    description: "Directory containing built artifacts for SBOM"
    required: false
    default: "./drop"

  sbom_source_dir:
    description: "Directory containing source code for SBOM"
    required: false
    default: "./src"

  sbom_product_name:
    description: "Product name for SBOM"
    required: false
    default: ""

  sbom_product_version:
    description: "Product version for SBOM"
    required: false
    default: ""

  sbom_supplier:
    description: "Supplier name for SBOM"
    required: false
    default: ""

  sbom_namespace:
    description: "SBOM namespace"
    required: false
    default: ""

  sbom_output_file:
    description: "Where sbom-tool should write the application SBOM"
    required: false
    default: "./drop/spdx.json"

  allow_missing_sbom_tools:
    description: "Allow skipping SBOM generation if required tools are missing"
    required: false
    default: "false"
  
outputs:
  version:
    description: "Image Version"
    value: ${{ steps.image.outputs.version }}

runs:
  using: "composite"
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

    - name: Generate Docker Tags
      id: meta
      uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9
      with:
        images: ${{ inputs.image }}
        flavor: latest=${{ inputs.tag_latest }}
        tags: |
          type=raw,value=${{ inputs.version || 'latest' }},enable=${{ inputs.version != '' || inputs.tag_latest == 'true' }}
          type=edge,enable=${{ inputs.version == '' }}
          type=ref,event=pr,enable=${{ inputs.version == '' }}
          type=sha,enable=${{ inputs.tag_sha == 'true' }}
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}

    - name: Configuration
      id: image
      shell: bash
      env:
        STEPS_META_OUTPUTS_VERSION: ${{ steps.meta.outputs.version }}
        INPUTS_IMAGE: ${{ inputs.image }}
      run: |
        version="${STEPS_META_OUTPUTS_VERSION}"
        if [[ -z "$version" ]]; then
          echo "Failed to determine Docker image version from docker/metadata-action"
          exit 1
        fi

        image_ref="${INPUTS_IMAGE}:$version"

        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
            
        registry=$(echo "${INPUTS_IMAGE}" | cut -d/ -f1)
        if [[ "$registry" != *"."* ]]; then
          registry="docker.io"
        fi
        echo "registry=$registry" >> "$GITHUB_OUTPUT"
    
        echo "version: $version"
        echo "image: $image_ref"
        echo "registry: $registry"

    - name: Build image (local load for scanning)
      uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
      with:
        load: true
        context: ${{ inputs.context }}
        build-args: ${{ inputs.build_args }}
        secret-envs: ${{ inputs.secrets }}
        file: ${{ inputs.dockerfile }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Docker Scout - CVE scan
      continue-on-error: ${{ inputs.allow_vulnerabilities == 'true' }}
      uses: docker/scout-action@cd72f264beff1cd72735de31148b9d3244a0234a
      with:
        debug: true
        verbose-debug: true
        command: cves
        image: local://${{ steps.image.outputs.image_ref }}
        dockerhub-user: ${{ inputs.dockerhub_username }}
        dockerhub-password: ${{ inputs.dockerhub_password }}
        only-severities: critical,high
        only-fixed: true
        write-comment: ${{ github.event_name == 'pull_request' }}
        github-token: ${{ inputs.github_token }}
        exit-code: ${{ inputs.allow_vulnerabilities != 'true' }}

    - name: Login to ${{ steps.image.outputs.registry }}
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915
