name: 'Docker Push'
description: 'Build and push a docker image'
inputs:
  github_token:
    description: 'GitHub Token'
    required: true
  username:
    description: 'Username or github.actor'
    required: false
  password:
    description: 'Password or github.token'
    required: false
  dockerhub_username:
    description: 'DockerHub Username'
    required: true
  dockerhub_password:
    description: 'DockerHub Password'
    required: true
  image:
    description: 'Image Name'
    required: true
  context:
    description: 'Build Context'
    required: false
  build_args:
    description: 'Build Args'
    required: false
  secrets:
    description: 'Secrets (MY_SECRET=MY_ENV_VAR)'
  dockerfile:
    description: 'Dockerfile'
    required: false
  tag_latest:
    description: 'Tag Latest'
    required: false
    default: auto
  tag_sha:
    description: 'Tag SHA'
    required: false
    default: ''
  version:
    description: 'Version'
    required: false
  allow_vulnerabilities:
    description: 'Allow Vulnerabilities'
    required: false
    default: 'false'
  slack_webhook_url:
    description: 'Slack Webhook URL'
    required: false

outputs:
  version:
    description: "Image Version"
    value: ${{ steps.image.outputs.version }}

#
# Updated sha hashes 2026-04-26
#

runs:
  using: "composite"
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

    - name: Generate Docker Tags
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ inputs.image }}
        flavor: latest=${{ inputs.tag_latest }}
        tags: |
          type=raw,value=${{ inputs.version || 'latest' }},enable=${{ inputs.version != '' || inputs.tag_latest == 'true' }}
          type=edge,enable=${{ inputs.version == '' }}
          type=ref,event=pr,enable=${{ inputs.version == '' }}
          type=sha,enable=${{ inputs.tag_sha == 'true' }}
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}

    - name: Configuration
      id: image
      shell: bash
      env:
        STEPS_META_OUTPUTS_VERSION: ${{ steps.meta.outputs.version }}
        INPUTS_IMAGE: ${{ inputs.image }}
      run: |
        version="${STEPS_META_OUTPUTS_VERSION}"
        if [[ -z "$version" ]]; then
          echo "Failed to determine Docker image version from docker/metadata-action"
          exit 1
        fi

        image_ref="${INPUTS_IMAGE}:$version"

        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
            
        registry=$(echo "${INPUTS_IMAGE}" | cut -d/ -f1)
        if [[ "$registry" != *"."* ]]; then
          registry="docker.io"
        fi
        echo "registry=$registry" >> "$GITHUB_OUTPUT"
    
        echo "version: $version"
        echo "image: $image_ref"
        echo "registry: $registry"


    - name: Build image (local load for scanning)
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        load: true
        context: ${{ inputs.context }}
        build-args: ${{ inputs.build_args }}
        secret-envs: ${{ inputs.secrets }}
        file: ${{ inputs.dockerfile }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Docker Scout - CVE scan
      continue-on-error: ${{ inputs.allow_vulnerabilities == 'true' }}
      uses: docker/scout-action@7c6b6c3f7844478ace1ffd4e7aef649053d1f87d # v1.24.0
      with:
        debug: true
        verbose-debug: true
        command: cves
        image: local://${{ steps.image.outputs.image_ref }}
        dockerhub-user: ${{ inputs.dockerhub_username }}
        dockerhub-password: ${{ inputs.dockerhub_password }}
        only-severities: critical,high
        only-fixed: true
        write-comment: ${{ github.event_name == 'pull_request' }}
        github-token: ${{ inputs.github_token }}
        exit-code: ${{ inputs.allow_vulnerabilities != 'true' }}

    - name: Login to ${{ steps.image.outputs.registry }}
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      if: ${{ inputs.username != '' && inputs.password != '' }}
      with:
        registry: ${{ steps.image.outputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - name: ACR Login
      if: ${{ contains(steps.image.outputs.registry , '.azurecr.io') }}
      shell: bash
      env:
        STEPS_IMAGE_OUTPUTS_REGISTRY: ${{ steps.image.outputs.registry }}
      run: az acr login --name ${STEPS_IMAGE_OUTPUTS_REGISTRY}

    - name: Push image with attestations
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        push: true
        context: ${{ inputs.context }}
        build-args: ${{ inputs.build_args }}
        secret-envs: ${{ inputs.secrets }}
        file: ${{ inputs.dockerfile }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        sbom: true
        provenance: mode=max
        outputs: type=registry

    - name: Send Slack notification
      uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
      if: failure() && inputs.slack_webhook_url != ''
      with:
        webhook: ${{ inputs.slack_webhook_url }}
        webhook-type: incoming-webhook
        payload: |
          text: "${{ github.repository }} ${{ github.ref_name }} failed the CVE check"
          blocks:
            - type: header
              text:
                type: plain_text
                text: "CVE check failed"
                emoji: true
            - type: section
              text:
                type: mrkdwn
                text: "*Repository:* `${{ github.repository }}`\n*Ref:* `${{ github.ref_name }}`"
            - type: section
              text:
                type: mrkdwn
                text: ":warning: Vulnerabilities were found. Please review the workflow run for more details."
            - type: actions
              elements:
                - type: button
                  text:
                    type: plain_text
                    text: "View workflow run"
                    emoji: true
                  url: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  style: danger
